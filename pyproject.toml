[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "niimdesk"
version = "0.1.0"
description = "Desktop-App für den NIIMBOT B1 Etikettendrucker (Linux + Windows, Bluetooth LE)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.0",
    "PySide6>=6.7",
    "Pillow>=10.0",
    "qrcode>=7.4",
    "python-barcode>=0.15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
niimdesk = "niimdesk.cli:main"

[project.gui-scripts]
niimdesk-gui = "niimdesk.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
niimdesk = ["fonts/*.ttf", "fonts/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
