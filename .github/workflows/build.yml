name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # older glibc = runs on more distributions
            artifact: niimdesk-linux-x86_64
          - os: windows-latest
            artifact: niimdesk-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/niimdesk.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp packaging/niimdesk.png README.md LICENSE THIRD_PARTY_NOTICES.md dist/niimdesk/
          dist/niimdesk/niimdesk-cli diagnose
          dist/niimdesk/niimdesk-cli render -o dist/selftest.png
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist niimdesk

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist\niimdesk\
          dist\niimdesk\niimdesk-cli.exe diagnose
          if ($LASTEXITCODE -ne 0) { throw "diagnose failed" }
          dist\niimdesk\niimdesk-cli.exe render -o dist\selftest.png
          if ($LASTEXITCODE -ne 0) { throw "render failed" }
          Compress-Archive -Path dist\niimdesk -DestinationPath dist\${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: false
